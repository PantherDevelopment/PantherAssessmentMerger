name: Build and Release

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:

  # ─────────────────────────────────────────────
  #  macOS (arm64 — Apple Silicon)
  # ─────────────────────────────────────────────
  build-macos:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set version from tag
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          sed -i '' "s/VERSION = \".*\"/VERSION = \"$VERSION\"/" assessment_merger.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyQt6 pandas openpyxl pyinstaller

      - name: Build macOS app
        run: |
          pyinstaller --onefile --windowed \
            --name "Panther Assessment Merger" \
            --icon=panther_icon.icns \
            assessment_merger.py

      - name: Import signing certificate
        env:
          CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          echo "$CERTIFICATE_BASE64" | base64 --decode > certificate.p12
          security create-keychain -p actions build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p actions build.keychain
          security import certificate.p12 \
            -k build.keychain \
            -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k actions build.keychain

      - name: Sign all binaries inside app
        run: |
          find "dist/Panther Assessment Merger.app" \
            -type f \( -name "*.so" -o -name "*.dylib" -o -name "Python" \) \
            -print0 | xargs -0 -I{} \
            codesign --force --verify \
              --sign "Developer ID Application" \
              --options runtime "{}"

          codesign --deep --force --verify --verbose \
            --sign "Developer ID Application" \
            --options runtime \
            "dist/Panther Assessment Merger.app"

      - name: Create DMG
        run: |
          brew install create-dmg
          create-dmg \
            --volname "Panther Assessment Merger" \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 100 \
            --app-drop-link 425 120 \
            "dist/Panther-Assessment-Merger-macOS.dmg" \
            "dist/Panther Assessment Merger.app" || true

          if [ ! -f "dist/Panther-Assessment-Merger-macOS.dmg" ]; then
            hdiutil create -volname "Panther Assessment Merger" \
              -srcfolder "dist/Panther Assessment Merger.app" \
              -ov -format UDZO \
              "dist/Panther-Assessment-Merger-macOS.dmg"
          fi

      - name: Notarize DMG
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_ID_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcrun notarytool submit "dist/Panther-Assessment-Merger-macOS.dmg" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_ID_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" \
            --wait
          xcrun stapler staple "dist/Panther-Assessment-Merger-macOS.dmg"

      - name: Upload macOS DMG to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Panther-Assessment-Merger-macOS.dmg

  # ─────────────────────────────────────────────
  #  Windows
  # ─────────────────────────────────────────────
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set version from tag
        run: |
          $version = "${{ github.ref_name }}".TrimStart("v")
          (Get-Content assessment_merger.py) -replace 'VERSION = ".*"', "VERSION = `"$version`"" | Set-Content assessment_merger.py

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PyQt6 pandas openpyxl pyinstaller

      - name: Build Windows executable
        run: |
          pyinstaller --onefile --windowed `
            --name "Panther Assessment Merger" `
            --icon=panther_icon.ico `
            assessment_merger.py

      - name: Create ZIP
        run: |
          Compress-Archive `
            -Path "dist\Panther Assessment Merger.exe" `
            -DestinationPath "dist\Panther-Assessment-Merger-Windows.zip"

      - name: Upload Windows ZIP to release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/Panther-Assessment-Merger-Windows.zip
